[package]
name = "arbor_day"
version = "0.1.0"
edition = "2024"
# Bevy main is a git dependency, which crates.io does not accept (ledger X3).
publish = false

# Bevy is named by branch, exactly as every repo in the family names it: Cargo treats a branch and
# a rev as different sources even at the same commit, which would build two Bevys. `Cargo.lock`
# holds the commit.
[dependencies]
bevy = { git = "https://github.com/bevyengine/bevy.git", branch = "main", features = [
  "bevy_feathers",
  "bevy_settings",
  # Registers `Image`'s serialization, which the remote driver's screenshots need.
  "bevy_remote",
  "dynamic_linking",
] }
bevy_immediate = { git = "https://github.com/viridia/bevy_immediate", branch = "bevy-main" }
# Inert unless BEVY_REMOTE_DRIVER_PORT is set.
bevy_remote_driver = { git = "https://github.com/viridia/bevy_remote_driver" }
# The traits only: the species is written by reflection, with no serde derives (C10).
serde = "1.0.229"
serde_json = "1.0.154"
# Native file dialogs for Open and Save As (ledger X2).
rfd = "0.17.2"
# Paints the leaf texture (D20). Already in the lock file through Bevy; without its PNG feature,
# which would bring a second `png`.
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
